<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FinTally - Your Simple Finance Manager</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#111827;
  --muted:#64748b;
  --border:#e2e8f0;
  --primary:#111827;
  --primary2:#1f2937;
  --blue:#2563eb;
  --blue-bg:#eff6ff;
  --green:#16a34a;
  --green-bg:#f0fdf4;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --orange:#d97706;
  --orange-bg:#fffbeb;
  --purple:#7c3aed;
  --shadow:0 8px 30px rgba(15,23,42,.07);
  --radius:18px;
}

[data-theme="dark"]{
  --bg:#0b1120;
  --card:#111827;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:#243244;
  --primary:#f8fafc;
  --primary2:#e2e8f0;
  --blue:#60a5fa;
  --blue-bg:#172554;
  --green:#4ade80;
  --green-bg:#052e16;
  --red:#f87171;
  --red-bg:#450a0a;
  --orange:#fbbf24;
  --orange-bg:#451a03;
  --purple:#a78bfa;
  --shadow:0 8px 30px rgba(0,0,0,.2);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:86px;
}

button,input,select,textarea{font:inherit}

button{cursor:pointer}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--card);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);
}

.header-inner{
  max-width:1000px;
  margin:auto;
  padding:13px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:var(--primary);
  color:var(--bg);
  font-size:22px;
  font-weight:900;
}

.brand h1{
  margin:0;
  font-size:20px;
  line-height:1;
}

.brand p{
  margin:4px 0 0;
  font-size:11px;
  color:var(--muted);
}

.icon-btn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
}

main{
  max-width:1000px;
  margin:auto;
  padding:16px 14px 35px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin:12px 0;
  box-shadow:var(--shadow);
}

.hero{
  background:linear-gradient(135deg,#111827,#334155);
  color:white;
  border:none;
}

.hero .muted{color:#cbd5e1}

.hero-label{
  font-size:12px;
  opacity:.8;
}

.hero-value{
  font-size:34px;
  font-weight:850;
  margin:5px 0;
}

.hero-sub{
  font-size:13px;
  color:#cbd5e1;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.section-head h2{
  margin:0;
  font-size:18px;
}

.section-head h3{
  margin:0;
  font-size:15px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  padding:14px;
  background:var(--bg);
  border-radius:15px;
  border:1px solid var(--border);
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

.stat-value{
  margin-top:4px;
  font-size:21px;
  font-weight:800;
}

.good{color:var(--green)}
.bad{color:var(--red)}
.warn{color:var(--orange)}
.blue{color:var(--blue)}

.btn{
  border:0;
  border-radius:11px;
  padding:10px 13px;
  background:var(--primary);
  color:var(--bg);
  font-weight:750;
}

.btn-blue{
  background:var(--blue);
  color:white;
}

.btn-light{
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--border);
}

.btn-danger{
  background:var(--red-bg);
  color:var(--red);
}

.btn-green{
  background:var(--green);
  color:white;
}

.btn-small{
  padding:7px 9px;
  font-size:12px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.full{grid-column:1/-1}

label{
  display:block;
  font-size:12px;
  font-weight:750;
  color:var(--muted);
  margin:0 0 5px;
}

input,select,textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

textarea{
  min-height:80px;
  resize:vertical;
}

.month-selector{
  display:flex;
  align-items:center;
  gap:7px;
}

.month-selector button{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  font-size:20px;
}

.month-selector input{
  min-width:0;
}

.progress{
  height:9px;
  background:var(--border);
  border-radius:999px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:var(--blue);
  border-radius:999px;
  transition:.25s;
}

.budget-row{
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.budget-row:last-child{
  border-bottom:0;
}

.budget-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:7px;
  font-size:13px;
}

.list-item{
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.list-item:last-child{
  border-bottom:0;
}

.item-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.item-title{
  font-weight:800;
}

.item-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:4px 8px;
  font-size:10px;
  font-weight:800;
}

.badge-income{
  background:var(--green-bg);
  color:var(--green);
}

.badge-expense{
  background:var(--red-bg);
  color:var(--red);
}

.badge-needs{
  background:var(--blue-bg);
  color:var(--blue);
}

.badge-wants{
  background:var(--orange-bg);
  color:var(--orange);
}

.badge-savings{
  background:#f5f3ff;
  color:var(--purple);
}

[data-theme="dark"] .badge-savings{
  background:#2e1065;
}

.note{
  background:var(--bg);
  border:1px dashed var(--border);
  border-radius:11px;
  padding:9px 11px;
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:12px;
}

.tab{
  flex:0 0 auto;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--card);
  color:var(--muted);
  padding:8px 13px;
  font-weight:750;
}

.tab.active{
  background:var(--primary);
  color:var(--bg);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px 10px;
}

.goal{
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px;
  margin:9px 0;
}

.goal-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.goal-name{
  font-weight:850;
}

.goal-percent{
  font-weight:800;
}

.goal-meta{
  color:var(--muted);
  font-size:12px;
  margin:4px 0 10px;
}

.debt{
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px;
  margin:9px 0;
}

.debt-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.calendar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}

.calendar-title{
  font-weight:850;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.weekday{
  text-align:center;
  font-size:10px;
  font-weight:800;
  color:var(--muted);
  padding:5px 0;
}

.day{
  min-height:58px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:5px;
  background:var(--card);
  position:relative;
  cursor:pointer;
}

.day.empty-day{
  background:transparent;
  border-color:transparent;
  cursor:default;
}

.day:hover:not(.empty-day){
  border-color:var(--blue);
}

.day.today{
  box-shadow:inset 0 0 0 2px var(--blue);
}

.day.selected{
  background:var(--blue-bg);
  border-color:var(--blue);
}

.day-number{
  font-size:11px;
  font-weight:800;
}

.day-total{
  font-size:9px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
}

.day-dots{
  display:flex;
  gap:2px;
  margin-top:4px;
}

.dot{
  width:5px;
  height:5px;
  border-radius:50%;
}

.dot-income{background:var(--green)}
.dot-expense{background:var(--red)}

.calendar-detail{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
}

.year-summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.year-month{
  border:1px solid var(--border);
  border-radius:13px;
  padding:11px;
  cursor:pointer;
  background:var(--card);
}

.year-month:hover{
  border-color:var(--blue);
}

.month-name{
  font-size:12px;
  font-weight:800;
}

.month-amount{
  font-size:16px;
  font-weight:800;
  margin-top:4px;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  display:flex;
  justify-content:center;
  background:var(--card);
  border-top:1px solid var(--border);
  padding:7px max(7px,env(safe-area-inset-left))
           calc(7px + env(safe-area-inset-bottom));
  backdrop-filter:blur(14px);
}

.nav-btn{
  flex:1;
  max-width:130px;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:7px 4px;
  border-radius:12px;
  font-size:10px;
  font-weight:800;
}

.nav-btn.active{
  background:var(--bg);
  color:var(--text);
}

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:200;
  background:#111827;
  color:white;
  border-radius:12px;
  padding:11px 15px;
  font-size:13px;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:25px 0 15px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:150;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:10px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border-radius:20px;
  padding:17px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}

.modal-head h2{
  margin:0;
  font-size:18px;
}

.search-box{
  position:relative;
}

.search-box input{
  padding-left:38px;
}

.search-icon{
  position:absolute;
  left:13px;
  top:10px;
}

.bottom-nav .nav-btn{
  min-width:0;
  padding-left:4px;
  padding-right:4px;
}

@media(max-width:650px){

  .grid3{
    grid-template-columns:1fr 1fr;
  }

  .year-summary{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:480px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .grid2{
    grid-template-columns:1fr 1fr;
  }

  .grid3{
    grid-template-columns:1fr 1fr;
  }

  .day{
    min-height:50px;
  }

  .day-total{
    display:none;
  }

  .hero-value{
    font-size:29px;
  }

}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style id="fintally-auth-style">
#fintallyAuthGate{position:fixed;inset:0;z-index:99999;background:var(--bg,#f5f7fb);display:flex;align-items:center;justify-content:center;padding:20px}
#fintallyAuthGate.hidden{display:none}
.fintally-auth-card{width:min(420px,100%);background:var(--card,#fff);color:var(--text,#111827);border:1px solid var(--border,#e2e8f0);border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.fintally-auth-brand{text-align:center;margin-bottom:24px}.fintally-auth-logo{width:58px;height:58px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;background:var(--primary,#111827);color:var(--bg,#fff);font-size:25px;font-weight:900}.fintally-auth-brand h2{margin:0;font-size:28px}.fintally-auth-brand p{margin:7px 0 0;color:var(--muted,#64748b)}
.fintally-auth-label{display:block;font-weight:750;margin:0 0 7px}.fintally-auth-input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid var(--border);border-radius:12px;font-size:16px;background:var(--card);color:var(--text);outline:none}.fintally-auth-input:focus{border-color:var(--blue)}
.fintally-auth-btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:16px;cursor:pointer}.fintally-auth-btn:disabled{opacity:.6;cursor:not-allowed}.fintally-auth-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
#fintallyOtpBox{display:none}#fintallyAuthMessage{min-height:20px;margin-top:12px;text-align:center;font-size:14px}.fintally-error{color:var(--red)}.fintally-success{color:var(--green)}
#fintallyProfileTab{position:fixed;right:14px;bottom:78px;z-index:120;border:1px solid var(--border);border-radius:999px;padding:10px 14px;background:var(--card);color:var(--text);font-weight:800;box-shadow:var(--shadow);cursor:pointer}
#fintallyProfilePanel{position:fixed;right:14px;bottom:128px;z-index:121;width:min(340px,calc(100vw - 28px));background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.18);display:none}
#fintallyProfilePanel.open{display:block}.fintally-profile-row{padding:11px 0;border-bottom:1px solid var(--border)}.fintally-profile-key{font-size:12px;color:var(--muted)}.fintally-profile-value{font-weight:800;word-break:break-word;margin-top:3px}
</style>

</head>

  <div class="header-inner">

    <div class="brand">

<script>
"use strict";


/* =========================================================
   FINTALLY EMAIL OTP AUTH
========================================================= */
const FINTALLY_SUPABASE_URL = "https://vnymenbedlitdrdmjyjv.supabase.co";
const FINTALLY_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_m0xiqdP7PM3ZlgQ2vr7YAg_-Db48qgt";
const fintallySupabase = window.supabase.createClient(
  FINTALLY_SUPABASE_URL,
  FINTALLY_SUPABASE_PUBLISHABLE_KEY
);

let fintallyPendingEmail = "";

function fintallyMessage(message,type=""){
  const el=document.getElementById("fintallyAuthMessage");
  if(!el)return;
  el.textContent=message||"";
  el.className=type ? "fintally-"+type : "";
}

function fintallyShowOtp(){
  document.getElementById("fintallyEmailBox").style.display="none";
  document.getElementById("fintallyOtpBox").style.display="block";
}

function fintallyShowEmail(){
  document.getElementById("fintallyEmailBox").style.display="block";
  document.getElementById("fintallyOtpBox").style.display="none";
}

function fintallyShowApp(session){
  document.getElementById("fintallyAuthGate").classList.add("hidden");
  const user=session && session.user;
  document.getElementById("fintallyProfileEmail").textContent=(user&&user.email)||"—";
  document.getElementById("fintallyProfileSince").textContent=
    user&&user.created_at ? new Date(user.created_at).toLocaleDateString() : "—";
}

function fintallyShowLogin(){
  document.getElementById("fintallyAuthGate").classList.remove("hidden");
  document.getElementById("fintallyProfilePanel").classList.remove("open");
}

async function fintallySendOtp(){
  const email=document.getElementById("fintallyEmail").value.trim();
  if(!email){fintallyMessage("Enter your email address.","error");return;}

  const btn=document.getElementById("fintallySendOtp");
  btn.disabled=true;btn.textContent="Sending...";

  const {error}=await fintallySupabase.auth.signInWithOtp({
    email,
    options:{shouldCreateUser:true}
  });

  btn.disabled=false;btn.textContent="Send OTP";

  if(error){
    fintallyMessage(error.message,"error");
    return;
  }

  fintallyPendingEmail=email;
  fintallyShowOtp();
  fintallyMessage("OTP sent. Check your email.","success");
  document.getElementById("fintallyOtp").focus();
}

async function fintallyVerifyOtp(){
  const token=document.getElementById("fintallyOtp").value.trim();

  if(!/^\d{6}$/.test(token)){
    fintallyMessage("Enter the 6-digit OTP.","error");
    return;
  }

  const btn=document.getElementById("fintallyVerifyOtp");
  btn.disabled=true;btn.textContent="Verifying...";

  const {data,error}=await fintallySupabase.auth.verifyOtp({
    email:fintallyPendingEmail,
    token,
    type:"email"
  });

  btn.disabled=false;btn.textContent="Verify & Continue";

  if(error){
    fintallyMessage(error.message,"error");
    return;
  }

  if(data && data.session){
    fintallyShowApp(data.session);
  }else{
    fintallyMessage("Verification succeeded, but no session was returned.","error");
  }
}

document.getElementById("fintallySendOtp").addEventListener("click",fintallySendOtp);
document.getElementById("fintallyVerifyOtp").addEventListener("click",fintallyVerifyOtp);
document.getElementById("fintallyBackEmail").addEventListener("click",()=>{
  fintallyShowEmail();
  fintallyMessage("");
});
document.getElementById("fintallyOtp").addEventListener("input",e=>{
  e.target.value=e.target.value.replace(/\D/g,"").slice(0,6);
});
document.getElementById("fintallyProfileTab").addEventListener("click",()=>{
  document.getElementById("fintallyProfilePanel").classList.toggle("open");
});
document.getElementById("fintallyLogout").addEventListener("click",async()=>{
  await fintallySupabase.auth.signOut();
  fintallyShowLogin();
});

(async()=>{
  const {data:{session}}=await fintallySupabase.auth.getSession();
  if(session)fintallyShowApp(session);
  else fintallyShowLogin();

  fintallySupabase.auth.onAuthStateChange((_event,session)=>{
    if(session)fintallyShowApp(session);
    else fintallyShowLogin();
  });
})();


/* =========================================================
   FINTALLY DATA
========================================================= */

const STORAGE_KEY = "fintally_complete_v1";

const DEFAULT_DATA = {
  version: 1,

  budget: {
    needs: 50,
    wants: 30,
    savings: 20
  },

  transactions: [],

  debts: [],

  goals: [],

  settings: {
    theme: "system",
    currency: "₹"
  }
};

let data = loadData();

let selectedMonth = getCurrentMonth();

let selectedCalendarDate = today();

let currentPage = "home";

let transactionFilter = "all";

let transactionSearch = "";


/* =========================================================
   STORAGE
========================================================= */

function loadData(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      );

    if(!saved){
      return structuredClone(DEFAULT_DATA);
    }

    return normalizeData(saved);

  }catch(error){

    return structuredClone(DEFAULT_DATA);

  }

}

function normalizeData(saved){

  const result = structuredClone(DEFAULT_DATA);

  result.budget = {
    ...result.budget,
    ...(saved.budget || {})
  };

  result.transactions =
    Array.isArray(saved.transactions)
      ? saved.transactions
      : [];

  result.debts =
    Array.isArray(saved.debts)
      ? saved.debts
      : [];

  result.goals =
    Array.isArray(saved.goals)
      ? saved.goals
      : [];

  result.settings = {
    ...result.settings,
    ...(saved.settings || {})
  };

  return result;

}

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   BASIC HELPERS
========================================================= */

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function today(){

  return new Date()
    .toISOString()
    .slice(0,10);

}

function getCurrentMonth(){

  return today().slice(0,7);

}

function money(value){

  return data.settings.currency +
    Number(value || 0)
      .toLocaleString(
        "en-IN",
        {
          maximumFractionDigits:0
        }
      );

}

function number(value){

  return Number(value || 0);

}

function escapeHTML(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char])
    );

}

function formatDate(date){

  if(!date) return "";

  return new Date(
    date + "T00:00:00"
  ).toLocaleDateString(
    undefined,
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}

function monthLabel(month){

  return new Date(
    month + "-01T00:00:00"
  ).toLocaleDateString(
    undefined,
    {
      month:"long",
      year:"numeric"
    }
  );

}

function shortMonth(month){

  return new Date(
    month + "-01T00:00:00"
  ).toLocaleDateString(
    undefined,
    {
      month:"short"
    }
  );

}

function getMonthTransactions(month){

  return data.transactions.filter(
    t => t.date &&
         t.date.slice(0,7) === month
  );

}

function getMonthTotals(month){

  const list =
    getMonthTransactions(month);

  return {

    income:list
      .filter(t=>t.type==="income")
      .reduce((a,t)=>a+number(t.amount),0),

    needs:list
      .filter(t=>t.type==="expense" && t.bucket==="needs")
      .reduce((a,t)=>a+number(t.amount),0),

    wants:list
      .filter(t=>t.type==="expense" && t.bucket==="wants")
      .reduce((a,t)=>a+number(t.amount),0),

    savings:list
      .filter(t=>t.type==="expense" && t.bucket==="savings")
      .reduce((a,t)=>a+number(t.amount),0)

  };

}

function showToast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  setTimeout(
    ()=>el.classList.remove("show"),
    1800
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page){

  currentPage = page;

  closeModal();

  document
    .querySelectorAll(".nav-btn")
    .forEach(
      x=>x.classList.remove("active")
    );

  const nav =
    document.getElementById(
      "nav-" + page
    );

  if(nav){
    nav.classList.add("active");
  }

  if(page==="home"){
    renderHome();
  }

  if(page==="money"){
    renderMoney();
  }

  if(page==="debts"){
    renderDebts();
  }

  if(page==="goals"){
    renderGoals();
  }

}

/* =========================================================
   BUDGET
========================================================= */

function budgetRow(
  name,
  percentage,
  spent,
  budget,
  type
){

  const percent =
    budget > 0
      ? Math.min(
          100,
          spent / budget * 100
        )
      : 0;

  const remaining =
    Math.max(
      0,
      budget - spent
    );

  return `

    <div class="budget-row">

      <div class="budget-top">

        <span>
          <b>${name}</b>
          <span class="muted">
            ${percentage}%
          </span>
        </span>

        <span>
          <b>${money(spent)}</b>
          <span class="muted">
            / ${money(budget)}
          </span>
        </span>

      </div>

      <div class="progress">

        <div
          class="progress-bar"
          style="
            width:${percent}%;
            background:
              ${type==="orange"
                ? "var(--orange)"
                : type==="purple"
                  ? "var(--purple)"
                  : "var(--blue)"};
          ">
        </div>

      </div>

      <div
        class="small muted"
        style="margin-top:5px">

        ${money(remaining)}
        remaining

      </div>

    </div>

  `;

}


/* =========================================================
   MONTH NAVIGATION
========================================================= */

function changeMonth(amount){
  const [year, month] = selectedMonth.split("-").map(Number);
  const date = new Date(year, month - 1, 1);
  date.setMonth(date.getMonth() + Number(amount));

  selectedMonth =
    date.getFullYear() + "-" +
    String(date.getMonth() + 1).padStart(2,"0");

  selectedCalendarDate = selectedMonth + "-01";

  if(currentPage==="home"){
    renderHome();
  }else if(currentPage==="money"){
    renderMoney();
  }else{
    renderApp();
  }
}


/* =========================================================
   CALENDAR
========================================================= */

function calendarHTML(){

  const date =
    new Date(
      selectedMonth +
      "-01T00:00:00"
    );

  const year =
    date.getFullYear();

  const month =
    date.getMonth();

  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();

  const days =
    new Date(
      year,
      month + 1,
      0
    ).getDate();

  let html = `

    <div class="calendar">

      ${[
        "Sun","Mon","Tue",
        "Wed","Thu","Fri","Sat"
      ]
      .map(
        d=>`
          <div class="weekday">
            ${d}
          </div>
        `
      ).join("")}

  `;

  for(let i=0;i<firstDay;i++){

    html += `
      <div class="day empty-day"></div>
    `;

  }

  for(let day=1;day<=days;day++){

    const dateString =
      `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    const list =
      data.transactions.filter(
        t=>t.date===dateString
      );

    const income =
      list
        .filter(t=>t.type==="income")
        .reduce(
          (a,t)=>a+number(t.amount),
          0
        );

    const expense =
      list
        .filter(t=>t.type==="expense")
        .reduce(
          (a,t)=>a+number(t.amount),
          0
        );

    const selected =
      dateString===selectedCalendarDate;

    const isToday =
      dateString===today();

    html += `

      <div
        class="
          day
          ${selected ? "selected":""}
          ${isToday ? "today":""}
        "
        onclick="
          selectCalendarDate('${dateString}')
        ">

        <div class="day-number">
          ${day}
        </div>

        ${
          list.length
            ? `
              <div class="day-total">

                ${
                  income
                    ? `<span class="good">
                         +${money(income)}
                       </span>`
                    : ""
                }

                ${
                  expense
                    ? `<span class="bad">
                         -${money(expense)}
                       </span>`
                    : ""
                }

              </div>

              <div class="day-dots">

                ${
                  income
                    ? `<span class="dot dot-income"></span>`
                    : ""
                }

                ${
                  expense
                    ? `<span class="dot dot-expense"></span>`
                    : ""
                }

              </div>
            `
            : ""
        }

      </div>

    `;

  }

  html += `
    </div>

    ${calendarDateDetails()}

  `;

  return html;

}

function selectCalendarDate(date){

  selectedCalendarDate =
    date;

  if(currentPage==="home"){
    renderHome();
  }

}

function calendarDateDetails(){

  const list =
    data.transactions
      .filter(
        t=>t.date===selectedCalendarDate
      )
      .sort(
        (a,b)=>b.id-a.id
      );

  return `

    <div class="calendar-detail">

      <div class="section-head">

        <h3>
          ${formatDate(
            selectedCalendarDate

        </h3>

        <button
          class="btn btn-blue btn-small"
          onclick="
            openAddTransaction(
              'expense',
              '${selectedCalendarDate}'
            )

                  transaction

            ).join("")

              No transactions on this date.
            </div>
          `

}

          class="btn btn-blue"
          onclick="showPage('goals')">

  return data.goals
    .slice(0,3)
    .map(goalHTML)

          goal.saved /
          goal.target *
          100
        )
      : 0;

  return `

    <div class="goal">

      <div class="goal-head">

        <div>

          <div class="goal-name">
            🎯 ${escapeHTML(goal.name)}
          </div>

          <div class="goal-meta">
            ${money(goal.saved)}
            of
            ${money(goal.target)}
          </div>

        </div>

        <div class="goal-percent">
          ${percent.toFixed(0)}%
        </div>

      </div>

      <div class="progress">

        <div
          class="progress-bar"
          style="width:${percent}%">
        </div>

      </div>

    </div>

  `;

}

/* =========================================================
   YEAR OVERVIEW
========================================================= */

function availableYears(){

  const years =
    new Set();

  data.transactions.forEach(
    t=>{
      if(t.date){
        years.add(
          t.date.slice(0,4)
        );
      }
    }
  );

  years.add(
    selectedMonth.slice(0,4)
  );

  return [...years]
    .sort()
    .reverse();

}

function yearOptions(){

  const years =
    availableYears();

  const selected =
    selectedMonth.slice(0,4);

  return years
    .map(
      y=>`
        <option
          value="${y}"
          ${y===selected?"selected":""}>
          ${y}
        </option>
      `
    )
    .join("");

}

function renderYearOverview(){

  const select =
    document.getElementById(
      "overviewYear"
    );

  if(!select)return;

  const year =
    select.value;

  document.getElementById(
    "yearOverview"
  ).innerHTML =
    yearOverviewHTML(year);

}

function yearOverviewHTML(
  year=selectedMonth.slice(0,4)
){

  let html =
    `<div class="year-summary">`;

  for(let month=1;month<=12;month++){

    const key =
      `${year}-${String(month).padStart(2,"0")}`;

    const totals =
      getMonthTotals(key);

    const net =
      totals.income -
      totals.needs -
      totals.wants -
      totals.savings;

    html += `

      <div
        class="year-month"
        onclick="
          selectedMonth='${key}';
          currentPage='home';
          showPage('home');
        ">

        <div class="month-name">
          ${shortMonth(key)}
        </div>

        <div
          class="
            month-amount
            ${net>=0?"good":"bad"}
          ">

          ${money(net)}

        </div>

        <div class="small muted">
          Income ${money(totals.income)}
        </div>

      </div>

    `;

  }

  html += `</div>`;

  return html;

}

function debtRemaining(d){
  return Math.max(0, number(d.amount) - number(d.repaid));
}

function debtPeople(){
  const map = {};
  data.debts.forEach(d=>{
    const person = String(d.person || "").trim();
    if(!person)return;
    const key = person.toLowerCase();
    if(!map[key]){
      map[key] = {
        key,
        person,
        lent:[],
        borrowed:[]
      };
    }
    (d.kind==="lent" ? map[key].lent : map[key].borrowed).push(d);
  });
  return Object.values(map).sort((a,b)=>a.person.localeCompare(b.person));
}

function personBalance(person, kind){
  return person[kind].reduce(
    (sum,d)=>sum + debtRemaining(d),
    0
  );
}

function personHistoryHTML(person){
  const records = [
    ...person.lent.map(d=>({...d, _direction:"lent"})),
    ...person.borrowed.map(d=>({...d, _direction:"borrowed"}))
  ].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")) || b.id-a.id);

  if(!records.length){
    return `<div class="empty">No history.</div>`;
  }

  return records.map(d=>{
    const remaining = debtRemaining(d);
    return `
      <div class="list-item">
        <div class="item-top">
          <div>
            <div class="item-title">
              ${d._direction==="lent" ? "You lent" : "You borrowed"}
              ${money(d.amount)}
            </div>
            <div class="item-sub">
              ${formatDate(d.date)}
              · Remaining ${money(remaining)}
              ${d.dueDate ? " · Due " + formatDate(d.dueDate) : ""}
            </div>
          </div>
          <span class="badge ${d._direction==="lent" ? "badge-income" : "badge-expense"}">
            ${d._direction==="lent" ? "OWED TO ME" : "I OWE"}
          </span>
        </div>

        ${
          d.note
            ? `<div class="note">📝 ${escapeHTML(d.note)}</div>`
            : ""
        }

        ${
          Array.isArray(d.repayments) && d.repayments.length
            ? `
              <div style="margin-top:9px">
                <b class="small">Repayments</b>
                ${d.repayments.map(r=>`
                  <div class="item-sub" style="margin-top:4px">
                    ${formatDate(r.date)} · ${money(r.amount)}
                    ${r.note ? " · " + escapeHTML(r.note) : ""}
                  </div>
                `).join("")}
              </div>
            `
            : ""
        }
      </div>
    `;
  }).join("");
}

function saveDebt(){

  const person =
    document.getElementById("debtPerson").value.trim();

  const amount =
    number(document.getElementById("debtAmount").value);

  if(!person || amount<=0){
    alert("Enter a person and valid amount.");
    return;
  }

  data.debts.push({
    id:Date.now(),
    kind:document.getElementById("debtKind").value,
    person,
    amount,
    repaid:0,
    date:document.getElementById("debtDate").value || today(),
    dueDate:document.getElementById("debtDueDate").value,
    note:document.getElementById("debtNote").value.trim(),
    repayments:[]
  });

  saveData();
  closeModal();
  showToast("Debt added");
  renderDebts();
}

function recordPersonRepayment(personKey){

  const person = debtPeople().find(p=>p.key===personKey);
  if(!person)return;

  const remaining = personBalance(person,"lent");
  if(remaining<=0)return;

  const amount = number(prompt(
    `Total ${person.person} owes you: ${money(remaining)}\n\nRepayment amount:`,
    remaining
  ));

  if(amount<=0 || amount>remaining){
    alert("Enter an amount between ₹1 and the outstanding balance.");
    return;
  }

  const note = prompt("Repayment note (optional):","") || "";
  let left = amount;

  // Apply repayment to oldest outstanding lent records first.
  const records = [...person.lent]
    .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")) || a.id-b.id);

  for(const d of records){
    if(left<=0)break;

    const outstanding = debtRemaining(d);
    if(outstanding<=0)continue;

    const applied = Math.min(left,outstanding);
    d.repaid = number(d.repaid) + applied;

    if(!Array.isArray(d.repayments))d.repayments=[];

    d.repayments.push({
      id:Date.now()+Math.floor(Math.random()*1000),
      amount:applied,
      date:today(),
      note:note
    });

    left -= applied;
  }

  saveData();
  showToast("Repayment recorded");
  renderDebts();
}

  const label =
    action==="add"
      ? "Amount to add:"
      : "Amount to remove:";

  const amount =
    number(
      prompt(
        `${label}\nCurrent: ${money(goal.saved)}`,
        100
      )
    );

  if(amount<=0)return;

  if(
    action==="add" &&
    goal.saved + amount >
    goal.target
  ){

    alert(
      `Maximum you can add is ${money(
        goal.target-goal.saved
      )}.`
    );

    return;

  }

  if(
    action==="remove" &&
    amount > goal.saved
  ){

    alert(
      `You can remove at most ${money(goal.saved)}.`
    );

    return;

  }

  if(action==="add"){
    goal.saved += amount;
  }else{
    goal.saved -= amount;
  }

  saveData();

  showToast(
    action==="add"
      ? "Money added to goal"
      : "Money removed from goal"
  );

  renderGoals();

}

function editGoal(id){

  const goal =
    data.goals.find(
      x=>x.id===id
    );

  if(!goal)return;

  openModal(`

    <div class="modal-head">

      <h2>Edit goal</h2>

      <button
        class="icon-btn"
        onclick="closeModal()">
        ✕
      </button>

    </div>


    <div class="form-grid">

      <div class="full">

        <label>Goal name</label>

        <input
          id="editGoalName"
          value="${escapeHTML(goal.name)}">

      </div>


      <div>

        <label>Target</label>

        <input
          id="editGoalTarget"
          type="number"
          value="${goal.target}">

      </div>

    </div>


    <div class="actions">

      <button
        class="btn btn-light"
        onclick="closeModal()">
        Cancel
      </button>

      <button
        class="btn btn-blue"
        onclick="
          updateGoal(${id})
        ">
        Save
      </button>

    </div>

  `);

}

function updateGoal(id){

  const goal =
    data.goals.find(
      x=>x.id===id
    );

  if(!goal)return;

  const name =
    document.getElementById(
      "editGoalName"
    ).value.trim();

  const target =
    number(
      document.getElementById(
        "editGoalTarget"
      ).value
    );

  if(
    !name ||
    target<=0 ||
    target<goal.saved
  ){

    alert(
      "Target must be greater than or equal to the saved amount."
    );

    return;

  }

  goal.name =
    name;

  goal.target =
    target;

  saveData();

  closeModal();

  showToast(
    "Goal updated"
  );

  renderGoals();

}

function deleteGoal(id){

  if(
    !confirm(
      "Delete this goal?"
    )
  )return;

  data.goals =
    data.goals.filter(
      g=>g.id!==id
    );

  saveData();

  showToast(
    "Goal deleted"
  );

  renderGoals();

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

  const total =
    data.budget.needs +
    data.budget.wants +
    data.budget.savings;

  openModal(`

    <div class="modal-head">

      <h2>Settings</h2>

      <button
        class="icon-btn"
        onclick="closeModal()">
        ✕
      </button>

    </div>


    <div class="card" style="margin:0">

      <h3>
        50 / 30 / 20 budget
      </h3>

      <p class="small muted">
        You can customize the percentages.
        The total must always equal 100%.
      </p>


      <div class="form-grid">

        <div>

          <label>Needs %</label>

          <input
            id="settingNeeds"
            type="number"
            value="${data.budget.needs}">

        </div>


        <div>

          <label>Wants %</label>

          <input
            id="settingWants"
            type="number"
            value="${data.budget.wants}">

        </div>


        <div>

          <label>Savings %</label>

          <input
            id="settingSavings"
            type="number"
            value="${data.budget.savings}">

        </div>

      </div>


      <div class="note">
        Current total: ${total}%
      </div>

      <button
        class="btn btn-blue"
        style="margin-top:10px"
        onclick="saveBudgetSettings()">
        Save budget
      </button>

    </div>


    <div class="card">

      <h3>Appearance</h3>

      <label style="margin-top:10px">
        Theme
      </label>

      <select
        id="themeSetting"
        onchange="changeTheme(this.value)">

        <option
          value="system"
          ${data.settings.theme==="system"?"selected":""}>
          System
        </option>

        <option
          value="light"
          ${data.settings.theme==="light"?"selected":""}>
          Light
        </option>

        <option
          value="dark"
          ${data.settings.theme==="dark"?"selected":""}>
          Dark
        </option>

      </select>

    </div>


    <div class="card">

      <h3>Backup & data</h3>

      <p class="small muted">
        Your data is stored locally in this browser.
        Export a backup regularly if your data is important.
      </p>

      <div class="actions">

        <button
          class="btn"
          onclick="exportBackup()">
          Export backup
        </button>

        <button
          class="btn btn-light"
          onclick="importBackup()">
          Import backup
        </button>

        <button
          class="btn btn-danger"
          onclick="resetAllData()">
          Delete all data
        </button>

      </div>

    </div>


    <div class="card">

      <h3>About FinMan</h3>

      <p class="small muted">
        A simple personal finance tracker
        designed for everyday use.
      </p>

      <p class="small muted">
        Version 2.0
      </p>

    </div>


    <footer>
      Built by Fazin
    </footer>

  `);

}

function saveBudgetSettings(){

  const needs =
    number(
      document.getElementById(
        "settingNeeds"
      ).value
    );

  const wants =
    number(
      document.getElementById(
        "settingWants"
      ).value
    );

  const savings =
    number(
      document.getElementById(
        "settingSavings"
      ).value
    );

  if(
    needs<0 ||
    wants<0 ||
    savings<0 ||
    needs+wants+savings!==100
  ){

    alert(
      "Needs + Wants + Savings must equal exactly 100%."
    );

    return;

  }

  data.budget.needs =
    needs;

  data.budget.wants =
    wants;

  data.budget.savings =
    savings;

  saveData();

  closeModal();

  showToast(
    "Budget settings saved"
  );

  showPage(currentPage);

}

function changeTheme(theme){

  data.settings.theme =
    theme;

  saveData();

  applyTheme();

}

function applyTheme(){

  let theme =
    data.settings.theme;

  if(theme==="system"){

    theme =
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches
        ? "dark"
        : "light";

  }

  document.documentElement
    .setAttribute(
      "data-theme",
      theme
    );

}


/* =========================================================
   BACKUP / RESTORE
========================================================= */

function exportBackup(){

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement("a");

  a.href=url;

  a.download =
    `finman-backup-${today()}.json`;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

  showToast(
    "Backup exported"
  );

}

function importBackup(){

  const input =
    document.createElement(
      "input"
    );

  input.type="file";

  input.accept=".json,application/json";

  input.onchange =
    event=>{

      const file =
        event.target.files[0];

      if(!file)return;

      const reader =
        new FileReader();

      reader.onload =
        ()=>{

          try{

            const imported =
              JSON.parse(
                reader.result
              );

            if(
              !imported ||
              !Array.isArray(
                imported.transactions
              ) ||
              !Array.isArray(
                imported.debts
              ) ||
              !Array.isArray(
                imported.goals
              )
            ){

              throw new Error(
                "Invalid backup"
              );

            }

            data =
              normalizeData(
                imported
              );

            saveData();

            closeModal();

            applyTheme();

            showToast(
              "Backup restored"
            );

            showPage(
              currentPage
            );

          }catch(error){

            alert(
              "This is not a valid FinMan backup."
            );

          }

        };

      reader.readAsText(file);

    };

  input.click();

}

function resetAllData(){

  if(
    !confirm(
      "WARNING: This will permanently delete all FinMan data stored on this device. Continue?"
    )
  )return;

  if(
    !confirm(
      "Are you absolutely sure? Your transactions, debts and goals will be deleted."
    )
  )return;

  data =
    structuredClone(
      DEFAULT_DATA
    );

  selectedMonth =
    getCurrentMonth();

  selectedCalendarDate =
    today();

  saveData();

  closeModal();

  showToast(
    "All FinMan data deleted"
  );

  showPage("home");

}


/* =========================================================
   MODAL
========================================================= */

function openModal(content){

  document.getElementById(
    "modalBox"
  ).innerHTML =
    content;

  document.getElementById(
    "modal"
  ).classList.add("show");

}

function closeModal(){

  document.getElementById(
    "modal"
  ).classList.remove("show");

}

document.getElementById(
  "modal"
).addEventListener(
  "click",
  event=>{

    if(
      event.target.id==="modal"
    ){
      closeModal();
    }

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Escape"){
      closeModal();
    }

  }
);


/* =========================================================
   SYSTEM THEME
========================================================= */

window
  .matchMedia(
    "(prefers-color-scheme: dark)"
  )
  .addEventListener(
    "change",
    ()=>{
      if(
        data.settings.theme==="system"
      ){
        applyTheme();
      }
    }
  );


/* =========================================================
   SERVICE WORKER
========================================================= */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    ()=>{
      navigator.serviceWorker
        .register("./sw.js")
        .catch(
          ()=>{}
        );
    }
  );

}


/* =========================================================
   START
========================================================= */

applyTheme();

showPage("home");

</script>
