</style></head><body><div id="authGate"><div class="authCard"><div class="authBrand"><div class="authLogo">F</div><h2>FinTally</h2><p>Your Simple Finance Manager</p></div><div id="emailBox"><label>Email address</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"><button id="sendOtp" class="btn blue authBtn">Send OTP</button></div><div id="otpBox"><label>6-digit OTP</label><input id="authOtp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"><button id="verifyOtp" class="btn blue authBtn">Verify & Continue</button><button id="changeEmail" class="btn light authBtn">Change Email</button></div><div id="authMsg" class="authMsg"></div></div></div><button id="profileTab">👤 Profile</button><div id="profilePanel"><h2 style="margin:0 0 8px">Profile</h2><div class="profileRow"><div class="profileKey">Email</div><div id="profileEmail" class="profileValue">—</div></div><div class="profileRow"><div class="profileKey">Member since</div><div id="profileSince" class="profileValue">—</div></div><button id="logoutBtn" class="btn red authBtn">Log out</button></div><header class="top"><div class="topin"><div class="brand"><div class="logo">F</div><div><h1>FinTally</h1><p>Your Simple Finance Manager</p></div></div><button class="btn light" onclick="settings()">⚙</button></div></header><main id="app"></main><nav class="bottom"><button id="n-home" onclick="home()">⌂<br>Home</button><button id="n-money" onclick="moneyPage()">↕<br>Money</button><button id="n-debt" onclick="debts()">🤝<br>Debts</button><button id="n-goal" onclick="goals()">🎯<br>Goals</button></nav><script>
const KEY='finman-v3',today=()=>new Date().toISOString().slice(0,10),cur=()=>today().slice(0,7),fmt=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});let S=JSON.parse(localStorage.getItem(KEY)||'null')||{incomeByMonth:{},needs:50,wants:30,savings:20,tx:[],debts:[],goals:[]};S.incomeByMonth=S.incomeByMonth||{};const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),income=m=>+S.incomeByMonth[m]||0,txm=m=>S.tx.filter(x=>(x.date||'').slice(0,7)==m),name=m=>{let[y,n]=m.split('-');return new Date(y,n-1,1).toLocaleString(undefined,{month:'long',year:'numeric'})};let month=cur();
function nav(x){document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));let e=document.getElementById('n-'+x);if(e)e.classList.add('active')};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))};function totals(m){let t=txm(m);return{needs:t.filter(x=>x.type=='expense'&&x.bucket=='needs').reduce((a,x)=>a+x.amount,0),wants:t.filter(x=>x.type=='expense'&&x.bucket=='wants').reduce((a,x)=>a+x.amount,0),savings:t.filter(x=>x.type=='expense'&&x.bucket=='savings').reduce((a,x)=>a+x.amount,0)}}function changeMonth(d){let [y,m]=month.split('-').map(Number);let x=new Date(y,m-1,1);x.setMonth(x.getMonth()+Number(d));month=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');home()}
function line(n,p,spent,bud){let q=bud?Math.min(100,spent/bud*100):0;return `<div class=budget><div class=budgettop><b>${n} <small>${p}%</small></b><span>${fmt(spent)} / ${fmt(bud)}</span></div><div class=progress><div class=bar style="width:${q}%"></div></div><small>${fmt(Math.max(0,bud-spent))} remaining</small></div>`}
function home(){nav('home');let t=totals(month),inc=income(month),spent=t.needs+t.wants+t.savings,remain=inc-spent;app.innerHTML=`<div class="card hero"><div class="muted">${name(month)}</div><div class=heroamt>${fmt(remain)}</div><div class=muted>remaining after expenses</div><div class=actions style="margin-top:14px"><button class="btn light" onclick="addQuick('income')">＋ Income</button><button class="btn light" onclick="moneyPage('expense')">− Expense</button></div></div><div class=card><div class=section><h2>Month</h2><small>Every year & month is tracked</small></div><div class=monthbar><button onclick="changeMonth(-1)">‹</button><input type=month value=${month} onchange="month=this.value;home()"><button onclick="changeMonth(1)">›</button></div></div><div class=grid><div class=stat><div class=label>Monthly income</div><div class=value>${fmt(inc)}</div></div><div class=stat><div class=label>Spent</div><div class=value>${fmt(spent)}</div></div><div class=stat><div class=label>Needs</div><div class=value>${fmt(t.needs)}</div></div><div class=stat><div class=label>Wants</div><div class=value>${fmt(t.wants)}</div></div></div><div class=card><div class=section><h2>50 / 30 / 20</h2><small>${S.needs}/${S.wants}/${S.savings}</small></div>${line('Needs',S.needs,t.needs,inc*S.needs/100)}${line('Wants',S.wants,t.wants,inc*S.wants/100)}${line('Savings',S.savings,t.savings,inc*S.savings/100)}</div><div class=card><div class=section><h2>Savings goals</h2><button class="btn blue" onclick="goals()">＋ Add goal</button></div>${goalCards(3)}</div><div class=card><div class=section><h2>Recent transactions</h2><button class="btn light" onclick="moneyPage()">View all</button></div>${txm(month).slice().sort((a,b)=>b.id-a.id).slice(0,5).map(x=>`<div class=row><div><b>${x.type=='income'?'+':'−'} ${fmt(x.amount)}</b><div class=sub>${esc(x.category||x.bucket)} · ${x.date}</div></div><button class="btn red" onclick="delTx(${x.id})">Delete</button></div>`).join('')||'<div class=empty>No transactions this month.</div>'}</div><footer>Built by Fazin</footer>`}
function addQuick(type){let n=+prompt(type=='income'?'Income amount':'Expense amount');if(!n||n<0)return;S.tx.push({id:Date.now(),type,amount:n,bucket:type=='income'?'income':'wants',category:type=='income'?'Income':'Expense',note:'',date:today()});save();home()}
function moneyPage(kind='expense'){nav('money');let rows=S.tx.filter(x=>(x.date||'').slice(0,7)==month).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);app.innerHTML=`<div class=section><h2>Money</h2><small>Selected month</small></div><div class=card><div class=monthbar><button onclick="changeMonth(-1);moneyPage(kind)">‹</button><input type=month value=${month} onchange="month=this.value;moneyPage(kind)"><button onclick="changeMonth(1);moneyPage(kind)">›</button></div></div><div class=card><div class=tabs><button class="tab ${kind=='expense'?'active':''}" onclick="moneyPage('expense')">Expense</button><button class="tab ${kind=='income'?'active':''}" onclick="moneyPage('income')">Income</button></div><div class=formgrid><div><label>Type</label><select id=tt><option value=expense ${kind=='expense'?'selected':''}>Expense</option><option value=income ${kind=='income'?'selected':''}>Income</option></select></div><div><label>Amount</label><input id=ta type=number min=0 placeholder="0"></div><div><label>Bucket</label><select id=tb><option value=needs>Needs</option><option value=wants>Wants</option><option value=savings>Savings</option></select></div><div><label>Date</label><input id=td type=date value=${today()}></div><div class=full><label>Category</label><input id=tc placeholder="Food, rent, transport, haircut..."></div><div class=full><label>Note</label><input id=tn placeholder="Optional note"></div></div><button class="btn blue" onclick="addTx()">Add transaction</button></div><div class=card><div class=section><h2>All transactions</h2><small>${rows.length} total</small></div>${rows.map(x=>`<div class=row><div><b class=${x.type=='income'?'good':''}>${x.type=='income'?'+':'−'} ${fmt(x.amount)}</b><div class=sub>${esc(x.category||x.bucket)} · ${x.date}${x.note?' · '+esc(x.note):''}</div></div><button class="btn red" onclick="delTx(${x.id})">Delete</button></div>`).join('')||'<div class=empty>No transactions yet.</div>'}</div><footer>Built by Fazin</footer>`}
function addTx(){let a=+ta.value;if(!a||a<0)return alert('Enter a valid amount.');let type=tt.value;S.tx.push({id:Date.now(),type,amount:a,bucket:type=='income'?'income':tb.value,category:tc.value||(type=='income'?'Income':tb.value),note:tn.value,date:td.value||today()});save();moneyPage(type)}function delTx(id){if(confirm('Delete this transaction?')){S.tx=S.tx.filter(x=>x.id!=id);save();home()}}
function debtPeople(){let p={};S.debts.forEach(d=>{let n=(d.person||'').trim();if(!n)return;if(!p[n])p[n]={name:n,history:[],balance:0};let sign=d.kind==='lent'?1:-1;let amt=Number(d.amount)||0;let rep=Number(d.repaid)||0;p[n].balance+=sign*(amt-rep);p[n].history.push(d)});return Object.values(p).sort((a,b)=>a.name.localeCompare(b.name))}
function debts(){nav('debt');let people=debtPeople();let owed=people.filter(p=>p.balance>0).reduce((a,p)=>a+p.balance,0),owe=people.filter(p=>p.balance<0).reduce((a,p)=>a+Math.abs(p.balance),0);app.innerHTML=`<div class=section><h2>Debts & People</h2><small>Each person has an account and history</small></div><div class=grid><div class=stat><div class=label>Owed to me</div><div class="value good">${fmt(owed)}</div></div><div class=stat><div class=label>I owe</div><div class="value bad">${fmt(owe)}</div></div></div><div class=card><h2>Add person / transaction</h2><div class=formgrid><div><label>Person</label><input id=dn placeholder="Name"></div><div><label>Type</label><select id=dk><option value=lent>They borrowed from me</option><option value=borrowed>I borrowed from them</option></select></div><div><label>Amount</label><input id=da type=number min=0 placeholder="₹0"></div><div><label>Date</label><input id=dd type=date value=${today()}></div><div class=full><label>Note</label><textarea id=dnote placeholder="Optional note"></textarea></div></div><button class="btn blue" onclick="addDebt()">＋ Add transaction</button></div><div class=card><div class=section><h2>People</h2><small>${people.length} account${people.length==1?'':'s'}</small></div>${people.length?people.map(p=>`<div class=goal><div class=goalhead><div><b>👤 ${esc(p.name)}</b><div class=sub>${p.balance>0?'Owes you ':p.balance<0?'You owe ':''}${p.balance?fmt(Math.abs(p.balance)):'Settled'}</div></div><button class="btn blue" onclick="debtHistory('${encodeURIComponent(p.name)}')">History</button></div></div>`).join(''):'<div class=empty>No people yet.</div>'}</div><footer>Built by Fazin</footer>`}
function addDebt(){let p=dn.value.trim(),a=+da.value;if(!p||!a||a<0)return alert('Enter person and amount.');S.debts.push({id:Date.now(),kind:dk.value,person:p,amount:a,repaid:0,date:dd.value||today(),note:dnote.value||''});save();debts()}
function debtHistory(encoded){let person=decodeURIComponent(encoded),items=S.debts.filter(d=>(d.person||'').trim()===person).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.id-b.id);let bal=0;let html=items.map(d=>{let amount=Number(d.amount)||0;let sign=d.kind==='lent'?1:-1;bal+=sign*(amount-(Number(d.repaid)||0));return `<div class=row><div><b>${d.kind==='lent'?'+':'−'} ${fmt(amount)}</b><div class=sub>${d.date||''}${d.note?' · '+esc(d.note):''}</div></div><b>${fmt(Math.abs(bal))}</b></div>`}).join('');app.innerHTML=`<div class=section><button class="btn light" onclick="debts()">← Back</button><h2>${esc(person)}</h2></div><div class=card><h2>Current balance</h2><div class=heroamt style="color:${items.reduce((s,d)=>s+(d.kind==='lent'?1:-1)*(Number(d.amount)||0),0)>=0?'var(--green)':'var(--red)'}">${fmt(Math.abs(items.reduce((s,d)=>s+(d.kind==='lent'?1:-1)*(Number(d.amount)||0),0)))}</div><div class=sub>${(()=>{let b=items.reduce((s,d)=>s+(d.kind==='lent'?1:-1)*(Number(d.amount)||0),0);return b>0?'They owe you':b<0?'You owe them':'Settled'})()}</div></div><div class=card><h2>History</h2>${html||'<div class=empty>No history.</div>'}</div><footer>Built by Fazin</footer>`}
function repay(id){let d=S.debts.find(x=>x.id==id),a=+prompt('Repayment amount',Math.max(0,d.amount-(d.repaid||0)));if(!a||a<0)return;d.repaid=Math.min(d.amount,(d.repaid||0)+a);save();debts()}
function goals(){nav('goal');app.innerHTML=`<div class=section><h2>Savings goals</h2><small>Create multiple goals</small></div><div class=card><h2>Create a goal</h2><div class=formgrid><div><label>Goal name</label><input id=gn placeholder="Emergency fund, bike, laptop..."></div><div><label>Target amount</label><input id=gt type=number min=0 placeholder="₹0"></div></div><button class="btn blue" onclick="addGoal()">＋ Create goal</button></div><div class=card><div class=section><h2>Your goals</h2><small>${S.goals.length} goal${S.goals.length==1?'':'s'}</small></div>${goalCards()}</div><footer>Built by Fazin</footer>`}
function goalCards(limit=999){return S.goals.length?S.goals.slice(0,limit).map(g=>{let p=g.target?Math.min(100,g.saved/g.target*100):0;return `<div class=goal><div class=goalhead><div><div><b>🎯 ${esc(g.name)}</b></div><div class=sub>${fmt(g.saved)} saved of ${fmt(g.target)} · ${p.toFixed(0)}%</div></div><button class="btn red" onclick="deleteGoal(${g.id})">Delete</button></div><div class=progress style="margin:11px 0"><div class=bar style="width:${p}%"></div></div><div class=actions><button class="btn blue" onclick="goalChange(${g.id},1)">＋ Add money</button><button class="btn light" onclick="goalChange(${g.id},-1)">− Remove money</button></div></div>`}).join(''):'<div class=empty>No goals yet. Create your first goal above.</div>'}function addGoal(){let n=gn.value.trim(),t=+gt.value;if(!n||!t)return alert('Enter a goal name and target.');S.goals.push({id:Date.now(),name:n,target:t,saved:0});save();goals()}function goalChange(id,d){let g=S.goals.find(x=>x.id==id),a=+prompt(d>0?'Amount to add':'Amount to remove',100);if(!a||a<0)return;let v=g.saved+(d>0?a:-a);if(v<0)return alert('Saved amount cannot go below ₹0.');if(v>g.target)return alert('Saved amount cannot exceed the target.');g.saved=v;save();goals()}function deleteGoal(id){if(confirm('Delete this goal?')){S.goals=S.goals.filter(x=>x.id!=id);save();goals()}}
function settings(){nav('');app.innerHTML=`<div class=section><h2>Settings</h2><small>Preferences & backups</small></div><div class=card><h2>50 / 30 / 20</h2><div class=formgrid><div><label>Needs %</label><input id=np type=number value=${S.needs}></div><div><label>Wants %</label><input id=wp type=number value=${S.wants}></div><div><label>Savings %</label><input id=sp type=number value=${S.savings}></div></div><button class="btn blue" onclick="budget()">Save budget</button><div class=note style="margin-top:10px">The three percentages must total exactly 100%.</div></div><div class=card><h2>Backup</h2><p class=sub>Your data is stored locally on this device/browser.</p><div class=actions><button class=btn onclick="exportData()">Export backup</button><button class="btn light" onclick="importData()">Import backup</button><button class="btn red" onclick="clearData()">Clear all data</button></div></div><div class=card><h2>About FinTally</h2><p class=sub>General-purpose personal finance management. No bank connection.</p></div><footer>Built by Fazin</footer>`}
function budget(){let a=+np.value,b=+wp.value,c=+sp.value;if(a+b+c!=100)return alert('Needs + Wants + Savings must equal 100%.');S.needs=a;S.wants=b;S.savings=c;save();home()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='fintally-backup.json';a.click()}function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.tx||!x.debts||!x.goals)throw 0;S={...S,...x,incomeByMonth:x.incomeByMonth||{}};save();home()}catch(e){alert('Invalid FinTally backup.')}};r.readAsText(i.files[0])};i.click()}function clearData(){if(confirm('Delete all FinTally data on this device?')){localStorage.removeItem(KEY);S={incomeByMonth:{},needs:50,wants:30,savings:20,tx:[],debts:[],goals:[]};home()}}

const FINTALLY_SUPABASE_URL="https://vnymenbedlitdrdmjyjv.supabase.co";const FINTALLY_SUPABASE_PUBLISHABLE_KEY="sb_publishable_m0xiqdP7PM3ZlgQ2vr7YAg_-Db48qgt";const fintallySupabase=window.supabase.createClient(FINTALLY_SUPABASE_URL,FINTALLY_SUPABASE_PUBLISHABLE_KEY);let pendingEmail='';
function authMsg(s,c){let e=document.getElementById('authMsg');e.textContent=s||'';e.className='authMsg '+(c||'')}
function showLogin(){document.getElementById('authGate').style.display='flex';document.getElementById('profilePanel').classList.remove('open');document.getElementById('emailBox').style.display='block';document.getElementById('otpBox').style.display='none';authMsg('')}
function showApp(session){document.getElementById('authGate').style.display='none';let u=session&&session.user;document.getElementById('profileEmail').textContent=u&&u.email||'—';document.getElementById('profileSince').textContent=u&&u.created_at?new Date(u.created_at).toLocaleDateString():'—'}
document.getElementById('sendOtp').onclick=async()=>{let email=document.getElementById('authEmail').value.trim();if(!email)return authMsg('Enter your email address.','authError');let b=document.getElementById('sendOtp');b.disabled=true;b.textContent='Sending...';let r=await fintallySupabase.auth.signInWithOtp({email,options:{shouldCreateUser:true}});b.disabled=false;b.textContent='Send OTP';if(r.error)return authMsg(r.error.message,'authError');pendingEmail=email;document.getElementById('emailBox').style.display='none';document.getElementById('otpBox').style.display='block';authMsg('OTP sent. Check your email.','authSuccess');document.getElementById('authOtp').focus()};
document.getElementById('verifyOtp').onclick=async()=>{let token=document.getElementById('authOtp').value.trim();if(!/^\d{6}$/.test(token))return authMsg('Enter the 6-digit OTP.','authError');let b=document.getElementById('verifyOtp');b.disabled=true;b.textContent='Verifying...';let r=await fintallySupabase.auth.verifyOtp({email:pendingEmail,token,type:'email'});b.disabled=false;b.textContent='Verify & Continue';if(r.error)return authMsg(r.error.message,'authError');if(r.data&&r.data.session)showApp(r.data.session)};
document.getElementById('changeEmail').onclick=showLogin;document.getElementById('authOtp').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);document.getElementById('profileTab').onclick=()=>document.getElementById('profilePanel').classList.toggle('open');document.getElementById('logoutBtn').onclick=async()=>{await fintallySupabase.auth.signOut();showLogin()};
fintallySupabase.auth.getSession().then(r=>{if(r.data&&r.data.session)showApp(r.data.session);else showLogin()});fintallySupabase.auth.onAuthStateChange((_e,s)=>{if(s)showApp(s);else showLogin()});
</script></body></html>
